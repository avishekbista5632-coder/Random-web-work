<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mouse Event</title>
<style>
#hovered {
    color: black;
    background-color: white;
}
</style>
</head>
<body>
<p id="hovered" onmouseover="changeColor()" onmouseout="defaultColor()">Hover over me</p>

<script>
function changeColor() {
    document.getElementById("hovered").style.color = "blue";
    document.getElementById("hovered").style.backgroundColor = "yellow";
}

function defaultColor() {
    document.getElementById("hovered").style.color = "black";
    document.getElementById("hovered").style.backgroundColor = "white";
}
</script>
</body>
</html>
