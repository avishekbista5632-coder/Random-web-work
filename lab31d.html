<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keyboard Events</title>
</head>
<body>
<input type="text" onkeydown="onKeyDownEvent()" onkeypress="onKeyPressEvent()" onkeyup="onKeyUpEvent()">

<script>
function onKeyDownEvent() {
    console.log("Key down event occurred");
}

function onKeyPressEvent() {
    console.log("Key press event occurred");
}

function onKeyUpEvent() {
    console.log("Key up event occurred");
}
</script>
</body>
</html>
