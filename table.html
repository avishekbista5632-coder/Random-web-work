<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table with rowspan and colspan</title>
</head>
<body>

<h2>Table with rowspan and colspan</h2>

<table border="1">
    <tr>
        <td rowspan="2">Cell 1<br>(spans 2 rows)</td>
        <td colspan="2">Cell 2 (spans 2 columns)</td>
        <td>Cell 4</td>
    </tr>
    <tr>
        <td>Cell 3</td>
        <td>Cell 5</td>
    </tr>
    <tr>
        <td colspan="3">Cell 6 (spans 3 columns)</td>
        <td>Cell 7</td>
    </tr>
</table>

</body>
</html>
